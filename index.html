<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia Logistics & Delivery Partner Portal</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --jumia-orange: #F68B1E;
            --jumia-dark: #282828;
            --jumia-gray: #F5F5F7;
            --jumia-border: #E0E0E0;
            --success-green: #388E3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--jumia-gray);
            color: var(--jumia-dark);
            line-height: 1.5;
        }

        /* Header */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--jumia-border);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            color: var(--jumia-dark);
            font-weight: 700;
        }

        .logo-area h1 span {
            color: var(--jumia-orange);
        }

        .secure-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--success-green);
            background: #E8F5E9;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Main Container */
        .container {
            max-width: 750px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--jumia-border);
        }

        /* Hero Banner inside Card */
        .hero-banner {
            background: linear-gradient(135deg, var(--jumia-dark), #424242);
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }

        .hero-banner h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .hero-banner p {
            font-size: 0.95rem;
            color: #ccc;
        }

        /* Progress Steps */
        .steps-indicator {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            background: #fafafa;
            border-bottom: 1px solid var(--jumia-border);
        }

        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step span {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            border-radius: 50%;
            background: #ddd;
            color: #666;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .step p {
            font-size: 0.75rem;
            color: #777;
            font-weight: 500;
        }

        .step.active span {
            background: var(--jumia-orange);
            color: #fff;
        }

        .step.active p {
            color: var(--jumia-dark);
            font-weight: 700;
        }

        .step.completed span {
            background: var(--success-green);
            color: #fff;
        }

        /* Form Sections */
        .form-section {
            padding: 30px;
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--jumia-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--jumia-border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--jumia-orange);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Vehicle Selector Cards */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .vehicle-card {
            border: 2px solid var(--jumia-border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vehicle-card i {
            font-size: 1.8rem;
            color: #666;
            margin-bottom: 8px;
        }

        .vehicle-card h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .vehicle-card p {
            font-size: 0.75rem;
            color: #666;
        }

        .vehicle-card.selected {
            border-color: var(--jumia-orange);
            background: #FFF8F0;
        }

        .vehicle-card.selected i {
            color: var(--jumia-orange);
        }

        /* Fee Box */
        .fee-box {
            background: #FFF8F0;
            border: 1px dashed var(--jumia-orange);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .fee-box h4 {
            color: var(--jumia-orange);
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fee-box p {
            font-size: 0.88rem;
            color: #555;
            margin-bottom: 12px;
        }

        .fee-amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--jumia-dark);
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-prev {
            background: #e0e0e0;
            color: #333;
        }

        .btn-next, .btn-submit {
            background: var(--jumia-orange);
            color: #fff;
            margin-left: auto;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Success screen */
        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .success-screen i {
            font-size: 4rem;
            color: var(--success-green);
            margin-bottom: 15px;
        }

        .success-screen h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .success-screen p {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
